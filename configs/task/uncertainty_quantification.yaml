# Task: Uncertainty Quantification optimization

task_name: "uncertainty_quantification"
function_str_to_extract: "make_estimator"

# Paths to raw statistics produced by the precompute script
train_raw_path: "data/uncertainty_quantification/popqa_train_filtered_10shot_raw_stats_hidden_states.pt"
test_raw_path: "data/uncertainty_quantification/popqa_test_filtered_10shot_raw_stats_hidden_states.pt"
background_raw_path: ""

# Train/val splitting for the raw train set
sample_size: 0        # 0 means use all available train samples
val_size: 0.2         # fraction of (sampled) train data used for validation
split_seed: 441
chunk_size: 1024      # number of eval samples per chunk when building features

# Supervision mode: when true, training statistics and labels are exposed
# to candidate estimators via the context dict.
supervised: false
# Available input features: "logits", "hidden_states", "attentions" or "full"
input_regime: "hidden_states"

failed_score: -1
timeout_period: 240
mem_limit_gb: 32

programdatabaseConfig:
  temp: 40.0




